[project]
name = "razorpay-buildathon-backend"
version = "0.1.0"
description = "Deterministic Commerce & AI Governance Control Plane for Razorpay AI Buildathon 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg-binary>=3.1.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
asyncio_mode = "auto"
